########################################
# Server Configuration
########################################
# 8080 is occupied on the dev/test machine; 8079 is the agreed port. Override with SERVER_PORT.
server.port=${SERVER_PORT:8079}
spring.application.name=library
spring.profiles.active=${SPRING_PROFILES_ACTIVE:development}

########################################
# Web (pagination) Configuration
########################################
# Hard ceiling for any client-supplied page size. Controllers that build their own
# PageRequest clamp to the same value (see ir.iau.library.controller.PageableFactory);
# this bound covers the endpoints that rely on Spring's Pageable resolver (e.g. /api/loan).
spring.data.web.pageable.max-page-size=100

########################################
# Database Configuration (H2 in-memory)
########################################
# Credentials are externalized; the H2 console is disabled by default (enable only in dev).
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.datasource.url=${DB_URL:jdbc:h2:mem:librarydb;}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
# The schema is owned by Flyway (src/main/resources/db/migration). Hibernate must
# only validate that the entities match the migrated schema, never alter it.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}

########################################
# Database Migrations (Flyway)
########################################
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
# Existing databases created by ddl-auto=update are stamped as the baseline; the
# V1 migration above is the authoritative schema for new/empty databases.
spring.flyway.locations=classpath:db/migration/h2
# `enable_lazy_load_no_trans` silently opens a session per lazy access outside a
# transaction. It hides N+1 queries and is documented by Hibernate as an anti-pattern.
# All LAZY associations here are either dereferenced inside @Transactional services or
# are @JsonIgnore'd, so it is disabled. Overridable for legacy deployments if needed.
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=${ENABLE_LAZY_LOAD_NO_TRANS:false}

# MySQL Example (commented)
# spring.datasource.url=jdbc:mysql://localhost:3306/library_db?serverTimezone=UTC
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

########################################
# Connection Pool (HikariCP)
########################################
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

########################################
# Hibernate Performance Tuning
########################################
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

########################################
# Envers (Audit Logging)
########################################
spring.jpa.properties.hibernate.ejb.interceptor.envers.enable=true
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_AUD
spring.jpa.properties.org.hibernate.envers.revision_field_name=REV
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=REVTYPE

########################################
# File Upload Configuration
########################################
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB

# Custom File Upload Settings
app.upload.dir=${UPLOAD_DIR:${user.home}/chat-uploads}
app.upload.max-file-size=${UPLOAD_MAX_FILE_SIZE:10485760}
app.import.max-rows=${IMPORT_MAX_ROWS:5000}

########################################
# WebSocket Configuration
########################################
# Comma-separated list of allowed origins. Avoid '*' when credentials are in play.
app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}
app.websocket.heartbeat-time=25000
app.websocket.disconnect-delay=5000

########################################
# Logging Configuration
########################################
#logging.level.ir.iau.library=DEBUG
#logging.level.org.springframework.web.socket=DEBUG
#logging.level.org.springframework.messaging=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#
## Log file settings
#logging.file.name=logs/chat-system.log
#logging.file.max-size=10MB
#logging.file.max-history=30

########################################
# JSON Serialization Configuration
########################################
spring.jackson.use-jackson2-defaults=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Tehran

########################################
# CORS Configuration
########################################
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

########################################
# Security Configuration
########################################
# Consumed by ir.iau.library.security.JwtService / SecurityConfig.
# JWT secret MUST be provided per-environment (env var JWT_SECRET). The app fails to
# start if it is blank or shorter than 32 bytes — no insecure default is shipped.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration=${JWT_EXPIRATION:86400}
# Operator credential for the back-office API (see AdminCredentials). The password is
# BCrypt-hashed in memory and never persisted. Both must be supplied per-environment.
app.security.admin.username=${APP_ADMIN_USERNAME:admin}
app.security.admin.password=${APP_ADMIN_PASSWORD:}
app.security.admin.email=${APP_ADMIN_EMAIL:}

# Password recovery uses expiring, one-time, SHA-256-token-hash records. Configure SMTP
# and the externally reachable UI origin before enabling it in a deployment.
app.password-reset.enabled=${PASSWORD_RESET_ENABLED:true}
app.password-reset.public-url=${PUBLIC_APP_URL:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Best-effort metadata search for staff book entry. Google Books public-volume requests
# require an API identifier; its provider is skipped unless GOOGLE_BOOKS_API_KEY is set.
app.catalog.open-library-base-url=${OPEN_LIBRARY_BASE_URL:https://openlibrary.org}
app.catalog.google-books-base-url=${GOOGLE_BOOKS_BASE_URL:https://www.googleapis.com/books/v1}
app.catalog.google-books-api-key=${GOOGLE_BOOKS_API_KEY:}

########################################
# Optional License Gate (disabled by default)
########################################
app.license.enabled=${APP_LICENSE_ENABLED:false}
app.license.interactive=${APP_LICENSE_INTERACTIVE:false}
# app.license.key is read from APP_LICENSE_KEY env var when the gate is enabled.

########################################
# Async Task Configuration
########################################
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100

########################################
# Locale & Timezone
########################################
# Jackson's time zone is the live setting (see spring.jackson.time-zone above).
# No app.timezone/app.locale keys are defined: they had no consumer and only
# invited drift from the actual Jackson configuration.

########################################
# Cleanup Job Configuration
########################################
# Cron syntax is Spring's 6-field CronExpression (second minute hour day month day-of-week).
# Do NOT use the Quartz '?' character — it is not accepted by Spring and fails at startup.
app.cleanup.enabled=${CLEANUP_ENABLED:true}
app.cleanup.cron=${CLEANUP_CRON:0 0 2 * * *}
app.cleanup.delete-files-older-than-days=${CLEANUP_DELETE_FILES_OLDER_THAN_DAYS:30}

# Daily expiry of overdue reservations.
app.reservation.expire-cron=${RESERVATION_EXPIRE_CRON:0 0 2 * * *}

# Daily transition of ON_LOAN loans past their due date to OVERDUE.
app.loan.overdue-cron=${LOAN_OVERDUE_CRON:0 0 2 * * *}
# Optional IANA timezone for business dates in loans/reservations; blank preserves the host zone.
app.business-zone=${APP_BUSINESS_ZONE:}

########################################
# Swagger / OpenAPI
########################################
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

########################################
# Logging
########################################
# SQL logging is opt-in via logging.level.org.hibernate.SQL (see application-development.properties).
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=ERROR
spring.jpa.show-sql=false

logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.root=INFO

spring.output.ansi.enabled=NEVER

