########################################
# Production profile overrides
########################################
# Fail-fast, secure-by-default settings for deployed environments.

# Schema management in production.
# This project does not yet ship migrations (no Flyway/Liquibase), so the default is
# `update` to preserve current behaviour. Once a migration tool is introduced, set
# JPA_DDL_AUTO=validate (or none) here and manage the schema through migrations.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# The H2 console must never be exposed in production.
spring.h2.console.enabled=false

# Quiet SQL logging in production.
logging.level.org.hibernate.SQL=WARN
spring.jpa.show-sql=false

# An explicit JWT secret is mandatory (no default supplied).
app.security.jwt.secret=${JWT_SECRET}

# No wildcard websocket origins in production; set explicitly.
app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:}
