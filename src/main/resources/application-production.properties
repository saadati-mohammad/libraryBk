########################################
# Production profile overrides
########################################
# Fail-fast, secure-by-default settings for deployed environments.

# Production must use a persistent MySQL service. No inherited in-memory H2 default.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.flyway.locations=classpath:db/migration/mysql

# Schema management in production is owned by Flyway; Hibernate only validates.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

# Migrations must run on startup in production.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true

# The H2 console must never be exposed in production.
spring.h2.console.enabled=false

# Quiet SQL logging in production.
logging.level.org.hibernate.SQL=WARN
spring.jpa.show-sql=false

# An explicit JWT secret is mandatory (no default supplied).
app.security.jwt.secret=${JWT_SECRET}

# No wildcard websocket origins in production; defaults to deployed frontend.
app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:https://lms-iau.vercel.app}

# Authentication is fail-closed in production: no default secret or credential is
# shipped. JWT_SECRET, APP_ADMIN_USERNAME and APP_ADMIN_PASSWORD must all be set as
# environment variables or the application refuses to start.
app.security.admin.username=${APP_ADMIN_USERNAME}
app.security.admin.password=${APP_ADMIN_PASSWORD}
app.security.admin.email=${APP_ADMIN_EMAIL:}

# CORS origins are explicit in production; defaults to deployed Vercel frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://lms-iau.vercel.app}

# Member self-registration stays disabled until the library enables its onboarding policy.
app.registration.enabled=${MEMBER_REGISTRATION_ENABLED:false}
# Recovery uses email delivery; set SMTP and the public URL before enabling it.
app.password-reset.enabled=${PASSWORD_RESET_ENABLED:false}
