########################################
# Development profile overrides
########################################
# Convenience-only settings for local development. Never enable these in production.

# H2 web console for local inspection
spring.h2.console.enabled=true

# Verbose SQL logging while developing
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.show-sql=false

# Default CORS origins for local Angular dev server
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000

# Local dev signing key (override with JWT_SECRET in real deployments)
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}
# Local dev operator credential (override with APP_ADMIN_PASSWORD in real deployments)
app.security.admin.username=${APP_ADMIN_USERNAME:admin}
app.security.admin.password=${APP_ADMIN_PASSWORD:admin}
