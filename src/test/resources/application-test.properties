# Test profile overrides.
# Disable background jobs so tests stay deterministic and no scheduler threads linger.
app.cleanup.enabled=false

# Isolated in-memory database. The schema is created by the Flyway baseline migration
# and then validated by Hibernate, exercising the same path production uses.
spring.datasource.url=jdbc:h2:mem:library-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=false
