# Test profile overrides.
# Disable background jobs so tests stay deterministic and no scheduler threads linger.
app.cleanup.enabled=false

# Keep tests on an isolated in-memory database and let Hibernate create the schema.
spring.datasource.url=jdbc:h2:mem:library-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
